<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1120" viewBox="0 0 1300 1120" role="img" aria-labelledby="title desc">
  <title id="title">How the SQL understanding plugin works</title>
  <desc id="desc">Claude chooses a bundled skill and tools. MCP analyzes saved SQL and optional catalog snapshots. LSP supports navigation and unsaved buffers. Separate processes use the same C sharp Core code, SqlScriptDOM parser and source-aware index. Claude combines returned evidence with Read and Grep to produce a cited explanation and explicit unknowns. No hooks or SQL execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#18283b}
      .title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#52637b}
      .head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#52637b}
      .box{stroke-width:1.5}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1300" height="1120" rx="20" fill="#f6f8fb"/>
  <text x="650" y="57" text-anchor="middle" class="title">How the SQL understanding plugin works</text>
  <text x="650" y="87" text-anchor="middle" class="sub">One marketplace install: skill + native executables + .NET runtime</text>

  <rect x="440" y="118" width="420" height="75" rx="12" fill="#ffffff" stroke="#b9c6d6" class="box"/>
  <text x="650" y="148" text-anchor="middle" class="head">Developer asks a question</text>
  <text x="650" y="175" text-anchor="middle" class="body">“How does ProcessPayroll handle Ohio?”</text>
  <path d="M650 193 V237" class="edge"/>

  <rect x="70" y="240" width="300" height="95" rx="12" fill="#e9edf9" stroke="#aebce2" class="box"/>
  <text x="220" y="271" text-anchor="middle" class="head">Explanation skill</text>
  <text x="220" y="298" text-anchor="middle" class="body">Guides tool use, evidence</text>
  <text x="220" y="321" text-anchor="middle" class="body">and uncertainty handling</text>
  <path d="M370 285 H437" class="edge" stroke-dasharray="5 5"/>
  <rect x="440" y="240" width="420" height="95" rx="12" fill="#e4eefb" stroke="#8fadd6" class="box"/>
  <text x="650" y="275" text-anchor="middle" class="head">Claude chooses tools</text>
  <text x="650" y="305" text-anchor="middle" class="body">Selection is model behavior</text>
  <rect x="930" y="240" width="300" height="95" rx="12" fill="#ffffff" stroke="#b9c6d6" class="box"/>
  <text x="1080" y="275" text-anchor="middle" class="head">Read / Grep</text>
  <text x="1080" y="304" text-anchor="middle" class="body">Business literals and source</text>
  <path d="M860 285 H927" class="edge" marker-start="url(#arrow)"/>

  <path d="M545 335 V370 H345 V409" class="edge"/>
  <path d="M755 335 V370 H955 V409" class="edge"/>
  <text x="345" y="360" text-anchor="middle" class="small">Procedure understanding</text>
  <text x="955" y="360" text-anchor="middle" class="small">Navigation when needed</text>
  <rect x="100" y="412" width="490" height="108" rx="12" fill="#e4f3ee" stroke="#8cbaab" class="box"/>
  <text x="345" y="445" text-anchor="middle" class="head">MCP server process</text>
  <text x="345" y="475" text-anchor="middle" class="body">find_procedures → analyze_procedure</text>
  <text x="345" y="501" text-anchor="middle" class="small">Reuse already expanded callee reports</text>
  <rect x="710" y="412" width="490" height="108" rx="12" fill="#e4eefb" stroke="#8fadd6" class="box"/>
  <text x="955" y="445" text-anchor="middle" class="head">LSP server process</text>
  <text x="955" y="475" text-anchor="middle" class="body">Definitions, references, call hierarchy</text>
  <text x="955" y="501" text-anchor="middle" class="small">Also diagnostics, symbols and hover</text>
  <path d="M345 520 V552" class="edge"/>
  <path d="M955 520 V552" class="edge"/>
  <rect x="100" y="555" width="490" height="88" rx="12" fill="#ffffff" stroke="#8cbaab" class="box"/>
  <text x="345" y="586" text-anchor="middle" class="head">Shared MCP source state</text>
  <text x="345" y="615" text-anchor="middle" class="body">Saved SQL files + opt-in catalog snapshots</text>
  <rect x="710" y="555" width="490" height="88" rx="12" fill="#ffffff" stroke="#8fadd6" class="box"/>
  <text x="955" y="586" text-anchor="middle" class="head">Independent LSP source state</text>
  <text x="955" y="615" text-anchor="middle" class="body">Unsaved buffers + saved/catalog fallback</text>
  <path d="M345 643 V675 H530 V707" class="edge"/>
  <path d="M955 643 V675 H770 V707" class="edge"/>
  <text x="650" y="667" text-anchor="middle" class="small">Same C# code; separate snapshots in each process</text>

  <rect x="260" y="710" width="780" height="112" rx="14" fill="#e9edf9" stroke="#aebce2" class="box"/>
  <text x="650" y="742" text-anchor="middle" class="head">SqlScriptDOM parser + source-aware index</text>
  <text x="650" y="773" text-anchor="middle" class="body">T-SQL → AST and ranges → verified identities and static dependencies</text>
  <text x="650" y="802" text-anchor="middle" class="body">Calls · table effects · control regions · bounded value dependencies</text>
  <path d="M650 822 V855" class="edge"/>
  <rect x="260" y="858" width="780" height="80" rx="12" fill="#e4f3ee" stroke="#8cbaab" class="box"/>
  <text x="650" y="890" text-anchor="middle" class="head">Return source evidence and explicit unknowns</text>
  <text x="650" y="918" text-anchor="middle" class="body">MCP: compact reports and file:line citations · LSP: verified locations</text>
  <path d="M650 938 V971" class="edge"/>
  <rect x="260" y="974" width="780" height="77" rx="12" fill="#ffffff" stroke="#b9c6d6" class="box"/>
  <text x="650" y="1005" text-anchor="middle" class="head">Claude writes the explanation for the developer</text>
  <text x="650" y="1033" text-anchor="middle" class="body">Combines evidence + source reading; answer accuracy still needs review</text>
  <text x="650" y="1091" text-anchor="middle" class="sub">No hooks. Claude chooses tools. The plugin analyzes SQL; it never executes the procedure.</text>
</svg>
