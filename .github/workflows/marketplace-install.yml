name: marketplace-install
on:
  workflow_dispatch:
    inputs:
      marketplaceSource:
        description: 'Marketplace Git URL or HTTPS catalog URL; use a candidate catalog before main rollout'
        type: string
        default: 'https://github.com/yongding422/ClaudeCode_SQL_LSP.git'
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    env:
      SQLLSP_TEST_MARKETPLACE_SOURCE: ${{ inputs.marketplaceSource }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - shell: pwsh
        run: ./scripts/test-marketplace-install.ps1 -Runtime '${{ matrix.rid }}' -MarketplaceSource $env:SQLLSP_TEST_MARKETPLACE_SOURCE
